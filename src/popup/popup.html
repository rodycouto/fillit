<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Fillit</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <img src="../../icons/icon16.png" alt="Fillit logo" class="logo">
    <h1>Fillit</h1>
  </header>

  <div class="input-card">
    <div class="inline-row">
      <!-- Menu suspenso de categorias customizável -->
      <div id="category-select-container" class="category-select-container">
        <button id="category-toggle-btn" type="button" class="category-toggle-btn">
          <span id="category-selected-label">Categorias</span>
          <span class="chevron">▾</span>
        </button>

        <div id="category-dropdown" class="category-dropdown hidden">
          <div class="add-category-box">
            <input type="text" id="new-category-input" placeholder="Nome da categoria..." autocomplete="off">
            <button id="add-category-btn" title="Criar categoria">＋</button>
          </div>

          <!-- Contêiner específico para os erros do menu suspenso -->
          <div id="category-error-message" class="error-text" style="display: none;"></div>

          <div class="category-dropdown-header">Minhas Categorias</div>
          <ul id="category-list" class="category-menu-list"></ul>
          <div id="no-categories-msg" class="no-categories-msg">Vazio</div>
        </div>
      </div>

      <input type="text" id="value" placeholder="Adicionar item..." autocomplete="off">

      <button id="add-button" title="Salvar">＋</button>
    </div>
  </div>

  <ul id="list"></ul>
  <div id="empty-message">Nenhum dado salvo</div>

  <div id="status"></div>
  <!-- <div id="profile-info"></div> -->

  <script src="script.js"></script>
</body>

</html>
