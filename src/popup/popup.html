<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Fillit</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <img src="../../icons/icon16.png" alt="Fillit logo" class="logo"> 
    <h1>Fillit</h1>
  </header>

<div class="input-card">
    <div class="inline-row">
      <div class="select-wrapper">
        <select id="category">
          <option value="email">Emails</option>
          <option value="phone">Telefones</option>
          <option value="name">Nomes</option>
          <option value="cpf">CPFs</option>
          <option value="cnpj">CNPJs</option>
          <option value="address">Endereços</option>
          <option value="zipcode">CEPs</option>
        </select>
      </div>

      <input type="text" id="value" placeholder="Adicionar item..." autocomplete="off">
      
      <button id="add-button" title="Salvar">＋</button>
    </div>
  </div>

  <ul id="list"></ul>
  <div id="empty-message">Nenhum dado salvo.</div>
  
  <div id="status"></div>
  <div id="profile-info"></div>

  <script src="script.js"></script>
</body>

</html>
